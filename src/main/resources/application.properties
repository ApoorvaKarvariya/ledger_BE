spring.application.name=task1
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

groq.api-key=${GROQ_API_KEY}
groq.base-url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

app.cors.allowed-origin=${FRONTEND_URL}